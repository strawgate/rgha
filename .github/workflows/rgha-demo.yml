# Smoke jobs that run on rgha-managed sandboxes.
#  - workflow_dispatch: run the tiny job, and optionally Docker-in-job on the
#    trusted VM-runtime class.
#  - pull_request touching .github/rgha-policy-probe: targets the trusted class
#    on purpose; rgha's policy cancels the run (PR code never reaches it).
name: rgha-demo

on:
  workflow_dispatch:
    inputs:
      docker:
        description: Also run Docker-in-job on rgha-docker
        type: boolean
        default: false
  pull_request:
    paths: [".github/rgha-policy-probe"]

permissions:
  contents: read

jobs:
  tiny:
    runs-on: rgha-tiny
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Where am I?
        run: |
          echo "runner: $RUNNER_NAME"
          uname -a
          nproc
          free -m || true
      - name: GitHub is reachable
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://api.github.com
      - name: Arbitrary egress is blocked (network = github-only)
        run: |
          if curl -fsS --max-time 5 https://example.com -o /dev/null; then
            echo "::warning::example.com was reachable; egress is not restricted"
          else
            echo "blocked as expected"
          fi

  docker:
    if: github.event_name == 'pull_request' || inputs.docker
    runs-on: rgha-docker
    timeout-minutes: 10
    steps:
      - name: Kernel
        run: uname -a
      - name: Docker works inside the job
        run: |
          docker version
          docker run --rm hello-world
