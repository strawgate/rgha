name: release

on:
  push:
    tags: ["v*"]
  # Dry run: build everything, publish nothing.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rgha
      - name: Package
        run: |
          name="rgha-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name" && cp target/release/rgha README.md LICENSE examples/rgha.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: matrix.arch
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/rgha
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rgha-*.tar.gz*

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
      - name: Lay out binaries per platform
        run: |
          for a in amd64 arm64; do mkdir -p dist/$a && mv linux-$a/rgha dist/$a/rgha && chmod +x dist/$a/rgha; done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke-test the amd64 image
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.release -t rgha:smoke --load .
          docker run --rm rgha:smoke --version
          docker run --rm rgha:smoke estimate --seconds 20
