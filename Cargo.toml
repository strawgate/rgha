[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/strawgate/rgha"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
futures = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots", "gzip"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
wiremock = "0.6"
proptest = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
rgha-scaleset = { path = "crates/rgha-scaleset" }
rgha-modal = { path = "crates/rgha-modal" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
